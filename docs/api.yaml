openapi: 3.0.3
info:
  title: Disc Golf Scorekeeper API
  version: 0.1.0
  description: Learning example. Calculates totals with completed-round validation and without persistence.
paths:
  /healthz:
    get:
      responses:
        '200':
          description: API is running; this does not check the database.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: pong
  /api/v1/rounds/total:
    post:
      summary: Calculate strokes, par, and score relative to par without saving the round
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Round'
      responses:
        '200':
          description: Scoring totals for a valid completed round.
          content:
            application/json:
              schema:
                type: object
                required: [total_strokes, total_par, score_relative_to_par]
                properties:
                  total_strokes:
                    type: integer
                    example: 7
                  total_par:
                    type: integer
                    example: 6
                  score_relative_to_par:
                    type: integer
                    description: Total strokes minus total par; positive is over par, negative is under par, and zero is even.
                    example: 1
        '400':
          description: JSON cannot be decoded or the round fails validation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /api/v1/rounds/course_par:
    post:
      summary: Calculate the course par from holes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Round'
      responses:
        '200':
          description: Sum of the holes par. 
          content: 
            application/json:
              schema:
                type: object
                required: [total_par]
                properties:
                  total_par:
                    type: integer
                    example: 60
        '400':
          description: JSON cannot be decoded or the round fails validation.
          content: 
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
components:
  schemas:
    Round:
      type: object
      description: Completed round. Hole numbers must be unique; validation returns the first error.
      required: [course_name, date, holes]
      properties:
        course_name:
          type: string
          minLength: 1
          description: Must contain non-whitespace text.
        date:
          type: string
          format: date
          description: Valid calendar date in YYYY-MM-DD format.
        holes:
          type: array
          minItems: 1
          items:
            type: object
            required: [hole_number, par, strokes]
            properties:
              hole_number:
                type: integer
                minimum: 1
              par:
                type: integer
                minimum: 1
              strokes:
                type: integer
                minimum: 1
